<!DOCTYPE html>
<html>
<head>
  <title>KPR Login</title>

  <style>
    body {
      font-family: Arial;
      background: #eef3f8;
      text-align: center;
      padding-top: 80px;
    }

    .box {
      background: white;
      width: 330px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px gray;
    }

    img {
      width: 250px;
      margin-bottom: 15px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px;
    }

    button {
      width: 95%;
      padding: 10px;
      background: #244a84;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <img src="images/kpr_logo.png" alt="KPR Logo">

    <h2>Student Login</h2>

    <input type="text" placeholder="Login ID">
    <input type="password" placeholder="Password">

    <button>Login</button>

    <p>KPR College of Arts Science and Research</p>
  </div>

</body>
</html>
